# Sidebar do one-block.
#
# Cada seção de 'boards' é um quadro. O primeiro cujas 'conditions' passam
# todas é o que o jogador vê; um quadro sem condição nenhuma é o padrão.
#
# Condições: spawn | world <nome> | permission <node> | placeholder %x% <valor>
#
# titles: string única ou lista (a lista vira animação, um quadro por ciclo).
# scores: a chave é o score (maior em cima), o valor é o texto MiniMessage.
# defaultHideNumber: esconde o número vermelho da direita (1.20.3+).
# defaultRenderEvery: intervalo de redesenho em ticks.
#
# Placeholders internos: %player% %online% %date% %time% %serverid%

enabled: true

boards:
  spawn:
    titles: '<gradient:#ff6600:#ffc66b><b>ONE BLOCK</b></gradient>'
    scores:
      14: ''
      13: ' <white>Localização: <gray>Spawn'
      11: ''
      10: '<white> Coins: <dark_green>$<white>%walletcoins%'
      9: '<white> Tempo online: <aqua>%playtime%'
      7: ''
      0: '<gray> redescreen.com '
    defaultHideNumber: true
    defaultRenderEvery: 20
    conditions:
    - spawn

  default:
    titles: '<gradient:#ff6600:#ffc66b><b>ONE BLOCK</b></gradient>'
    scores:
      16: ''
      15: '<white> Coins: <dark_green>$<white>%walletcoins%'
      14: ''
      13: '<white> <glyph:floating_islands> <color:#FFD54F>Seu raft:'
      12: '<white> Fase: <gray>%island_phasename%'
      10: ''
      9: '<white> Tempo online: <aqua>%playtime%'
      7: ''
      0: '<gray> redescreen.com '
    defaultHideNumber: true
    defaultRenderEvery: 20
    conditions: []
