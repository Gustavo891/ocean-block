reino:
  icon-gap: 4
  icon-size: 9
  text:
    titulo: { color: "#ffffff", font: titulo_ten, shadow: false }
    heading: { color: "#ffffff", font: cabecalho, shadow: false }
    heading_ouro: { color: "#f5d142", font: cabecalho, shadow: false }
    titulo_ouro: { color: "#f5d142", font: titulo_ten, shadow: false }
    body: { color: "#c4c6cb", font: pequena_justa, shadow: false }
    claro: { color: "#aeafb6", font: pequena_justa, shadow: false }
    branco: { color: "#ffffff", font: pequena_justa, shadow: false }
    muted: { color: "#aeafb6", font: pequena_justa, shadow: false }
    nota: { color: "#8b8d93", font: pequena_justa, shadow: false }
    good: { color: "#66b84a", font: pequena_justa, shadow: false }
    bad: { color: "#ff6a5c", font: pequena_justa, shadow: false }
    accent: { color: "#5fd6e8", font: pequena_justa, shadow: false }
    destaque: { color: "#f2a541", font: pequena_justa, shadow: false }
    ouro: { color: "#f5d142", font: pequena_justa, shadow: false }
    trilha: { color: "#2f7a24", font: pequena_justa, shadow: false }
    selected: { color: "#ffffa0", font: pequena_justa, shadow: false }
    count: { color: "#ffffff" }
    disabled: { color: "#898b8d", font: pequena_botao, shadow: false }
    button: { color: "#1f1f21", font: pequena_botao, shadow: false }
    button-light: { color: "#ffffff", font: pequena_botao, shadow: false }
    tooltip: { color: "#a8a8b3" }
  surfaces:
    moldura: ui:reino/moldura
    cartao: ui:reino/cartao_escuro
    faixa: ui:reino/faixa
    frame: ui:reino/faixa
  switch:
    labels: { on: "Ligado", off: "Desligado" }
  segmented:
    art: ui:stone/segment
    selected-art: ui:stone/segment_selected
    text-style: body
    selected-text-style: selected
    pad: 8
    frame: ui:stone/segment_frame
  button:
    art: ui:reino/botao
    text-style: button
    looks:
      claro:
        art: ui:reino/botao
        text-style: button
        disabled-art: ui:reino/botao_off
        disabled-text-style: disabled
      acao:
        art: ui:reino/botao_verde
        text-style: button-light
        disabled-art: ui:reino/botao_off
        disabled-text-style: disabled
      fechar:
        art: ui:reino/botao_fechar
        text-style: button-light
      pagina:
        art: ui:reino/botao_fechar
        text-style: button-light
        disabled-art: ui:reino/botao_fechar_off
        disabled-text-style: disabled
      no_trilha:
        art: ui:reino/no
        text-style: body
        selected-art: ui:reino/no_sel
        selected-text-style: body
      selecao:
        art: ui:reino/selecao
        text-style: body
        selected-art: ui:reino/selecao_on
        selected-text-style: body
  nav:
    art: ui:stone/nav
    active-art: ui:stone/nav_active
    text-style: body
    active-text-style: selected
    pad: 7
  dropdown:
    art: ui:stone/dropdown
    arrow: ui:stone/arrow_down
    text-style: body
  slider:
    track: ui:stone/slider_track
    fill: ui:stone/slider_fill
    text-style: body
  slots:
    art: ui:abismo/slot
    missing-art: ui:mare/slot_missing
    text-style: count
  chip:
    art: ui:mare/chip
    text-style: body
    height: 20
  icons:
    faixa_laranja: ui:reino/faixa_laranja
    faixa_azul: ui:reino/faixa_azul
    faixa_verde: ui:reino/faixa_verde
    no_atual: ui:reino/no_atual
    no_trancada: ui:reino/no_trancada
    no_feita: ui:reino/no_feita
    liga_verde: ui:reino/liga_verde
    liga_cinza: ui:reino/liga_cinza
    desce_verde: ui:reino/desce_verde
    desce_cinza: ui:reino/desce_cinza
    ponto_feito: ui:reino/ponto_feito
    ponto_ativo: ui:reino/ponto_ativo
    ponto_vazio: ui:reino/ponto_vazio
    pagina_esq: ui:reino/pagina_esq
    pagina_esq_off: ui:reino/pagina_esq_off
    pagina_dir: ui:reino/pagina_dir
    pagina_dir_off: ui:reino/pagina_dir_off
