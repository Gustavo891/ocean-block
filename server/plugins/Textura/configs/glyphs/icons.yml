# Gerado a partir dos glyphs do Nexo (namespace oneblock).
# bar_start/bar_mid/bar_end do Nexo viraram hud_left/hud_body/hud_right, que sao
# os ids que o HudBackground procura. As texturas e o unicode sao os mesmos.
# Os unicodes foram movidos para a Private Use Area (U+E100+). Os codepoints
# herdados do Nexo eram Syriac: U+0711/0610/0611 sao marcas combinantes
# (advance 0) e U+0720/0712 sao RTL fortes, que disparam reordenacao BiDi
# no cliente. Use sempre PUA aqui - nao altere sem regerar o pack.


# hover_complete e hover_current tem unicode fixo: os mesmos chars estao
# escritos a mao em configs/fonts/custom.json, base das font-ui-<ascent> que
# posicionam os selos no titulo de /is phases. Trocar aqui sem trocar la
# quebra o overlay.
hover_complete:
  id: hover_complete
  caminho: assets/oneblock/textures/icons/hover_complete.png
  unicode: \uE121
  ascent: 8
  size: 16
  height: 16
  default: true
  show_in_gui: true

hover_current:
  id: hover_current
  caminho: assets/oneblock/textures/icons/hover_current.png
  unicode: \uE122
  ascent: 8
  size: 16
  height: 16
  default: true
  show_in_gui: true

